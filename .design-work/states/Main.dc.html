<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#fafaf9; color:#1c1917; -webkit-font-smoothing:antialiased; }
  a { color:#2177d5; } a:hover { color:#1b5fa8; }
  textarea { font: inherit; color: inherit; }
  textarea::placeholder { color:#a8a29e; }
  .beam { position:absolute; inset:-150%; background: conic-gradient(from 90deg, transparent 0 318deg, #3b82f6 358deg, transparent 360deg); animation: dc-spin 2.2s linear infinite; }
  @keyframes dc-spin { to { transform: rotate(360deg); } }
  @keyframes dc-rise { from { opacity:0; transform: translateY(7px); } to { opacity:1; transform:none; } }
  .rise { animation: dc-rise .38s cubic-bezier(.16,1,.3,1) both; }
  .chip { transition: background .16s ease, border-color .16s ease, transform .16s ease; }
  .chip:hover { background:#f5f5f4; border-color:#d6d3d1; transform: translateY(-1px); }
  .sendbtn { transition: background .2s ease, box-shadow .2s ease, transform .12s ease; }
  .sendbtn:active { transform: scale(.94); }
  @media (prefers-reduced-motion: reduce) { .beam { animation: none; } .rise { animation: none; } }
</style>
</helmet>

<div style="display:flex; flex-direction:column; height:760px; box-sizing:border-box; padding:20px 22px 22px; gap:14px">

  <div style="display:flex; align-items:center; justify-content:space-between; flex-shrink:0">
    <div style="font-size:17px; font-weight:700; letter-spacing:-0.02em">Edward's AI</div>
    <div style="display:flex; align-items:center; gap:7px; padding:5px 10px; border-radius:9999px; background:#ffffff; border:1px solid #ece9e6">
      <span style="width:6px; height:6px; border-radius:9999px; background: {{ status.dot }}"></span>
      <span style="font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:#78716c">{{ status.label }}</span>
    </div>
  </div>

  <div style="flex-grow:1; display:flex; flex-direction:column; justify-content:flex-end; gap:12px; overflow:hidden">

    <sc-if value="{{ showIntro }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; justify-content:flex-start">
        <div style="max-width:85%; padding:16px; border-radius:16px; border-bottom-left-radius:4px; background:#ffffff; border:1px solid #f5f5f4; box-shadow:0 1px 2px rgba(28,25,23,.05); font-size:14px; line-height:1.625; color:#44403c">I'm grounded in Edward's real work — talks, case studies and product artifacts.</div>
      </div>
    </sc-if>

    <sc-for list="{{ turns }}" as="turn" hint-placeholder-count="2">
      <div class="rise" style="display:flex; justify-content: {{ turn.align }}">
        <div style="max-width:85%; padding:16px; border-radius:16px; font-size:14px; line-height:1.625; box-shadow:0 1px 2px rgba(28,25,23,.05); background: {{ turn.bg }}; color: {{ turn.fg }}; border:1px solid {{ turn.border }}; border-bottom-right-radius: {{ turn.brr }}; border-bottom-left-radius: {{ turn.blr }}">{{ turn.text }}</div>
      </div>
    </sc-for>

  </div>

  <sc-if value="{{ showChips }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; flex-wrap:wrap; gap:8px; flex-shrink:0">
      <sc-for list="{{ chips }}" as="chip" hint-placeholder-count="3">
        <button class="chip" onClick="{{ chip.pick }}" style="font:inherit; font-size:12.5px; font-weight:500; color:#57534e; background:#ffffff; border:1px solid #e7e5e4; border-radius:9999px; padding:8px 13px; cursor:pointer; line-height:1.2">{{ chip.label }}</button>
      </sc-for>
    </div>
  </sc-if>

  <div style="flex-shrink:0">
    <div style="position:relative; border-radius:16px; padding:1.5px; overflow:hidden; background: {{ shell.bg }}; box-shadow: {{ shell.glow }}; transition: box-shadow .22s ease, background .22s ease">
      <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
        <div class="beam"></div>
      </sc-if>
      <div style="position:relative; background:#ffffff; border-radius:14.5px; display:flex; align-items:flex-end; gap:8px; padding:10px 10px 10px 18px">
        <textarea id="dc-composer" rows="1" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" placeholder="Ask about a project, a decision, a tradeoff…" style="flex-grow:1; border:none; outline:none; resize:none; background:transparent; font-size:14px; line-height:1.55; padding:11px 0; max-height:118px; overflow-y:auto"></textarea>
        <button onClick="{{ onPrimary }}" class="sendbtn" style="flex-shrink:0; width:40px; height:40px; border:none; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; background: {{ btn.bg }}; box-shadow: {{ btn.shadow }}">
          <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
            <span style="width:11px; height:11px; border-radius:3px; background:#ffffff; display:block"></span>
          </sc-if>
          <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ btn.icon }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4Z"></path></svg>
          </sc-if>
        </button>
      </div>
    </div>
    <div style="height:17px; margin-top:7px; font-size:11.5px; color:#a8a29e; display:flex; justify-content:space-between; opacity: {{ hint.opacity }}; transition:opacity .22s ease">
      <span>{{ hint.left }}</span>
      <span>{{ hint.right }}</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":600,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '', focused: false, busy: false, turns: [] };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  send() {
    const q = this.state.draft.trim();
    if (!q || this.state.busy) return;
    this.setState({ draft: '', busy: true, turns: [...this.state.turns, { role: 'user', text: q }] });
    const box = document.getElementById('dc-composer');
    if (box) box.style.height = 'auto';
    this.timers.push(setTimeout(() => {
      if (!this.state.busy) return;
      this.setState({
        busy: false,
        turns: [...this.state.turns, { role: 'ai', text: 'Adopt AI’s agent runs on an intent graph — I mapped every product action to a callable node, then designed the surface so an unresolved intent degrades into a clarifying question instead of a dead end.' }],
      });
    }, 2600));
  }
  stop() { this.timers.forEach(clearTimeout); this.timers = []; this.setState({ busy: false }); }
  renderVals() {
    const { draft, focused, busy, turns } = this.state;
    const has = draft.trim().length > 0;
    const idle = !busy;
    const status = busy
      ? { label: 'Generating', dot: '#3b82f6' }
      : (has ? { label: 'Ready', dot: '#22c55e' } : { label: 'Idle', dot: '#d6d3d1' });
    const shell = busy
      ? { bg: '#ffffff', glow: '0 0 0 1px rgba(59,130,246,.16), 0 6px 22px -8px rgba(59,130,246,.34)' }
      : (focused
        ? { bg: '#e7e5e4', glow: '0 0 0 4px rgba(59,130,246,.10)' }
        : { bg: '#e7e5e4', glow: '0 1px 2px rgba(28,25,23,.04)' });
    const btn = busy
      ? { bg: '#1c1917', shadow: 'none', icon: '#ffffff' }
      : (has
        ? { bg: 'linear-gradient(to top right, #3b82f6, #0ea5e9)', shadow: '0 6px 16px -6px rgba(59,130,246,.55)', icon: '#ffffff' }
        : { bg: '#f5f5f4', shadow: 'none', icon: '#c4bfba' });
    const hint = busy
      ? { left: 'Esc or tap ■ to stop', right: '', opacity: '1' }
      : (focused
        ? { left: 'Enter to send', right: 'Shift + Enter for a new line', opacity: '1' }
        : { left: '', right: '', opacity: '0' });
    return {
      draft, busy, idle, status, shell, btn, hint,
      showIntro: turns.length === 0,
      showChips: turns.length === 0 && !busy,
      chips: [
        { label: 'How does Adopt AI’s agent work?' },
        { label: 'Walk me through SamaCare' },
        { label: 'Designing 0→1 in healthcare' },
      ].map((c) => ({ ...c, pick: () => this.setState({ draft: c.label, focused: true }) })),
      turns: turns.map((t) => t.role === 'user'
        ? { ...t, align: 'flex-end', bg: '#2563eb', fg: '#ffffff', border: '#2563eb', brr: '4px', blr: '16px' }
        : { ...t, align: 'flex-start', bg: '#ffffff', fg: '#44403c', border: '#f5f5f4', brr: '16px', blr: '4px' }),
      onDraft: (e) => {
        const el = e.target;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 118) + 'px';
        this.setState({ draft: el.value });
      },
      onKey: (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); }
        if (e.key === 'Escape' && this.state.busy) { e.preventDefault(); this.stop(); }
      },
      onFocus: () => this.setState({ focused: true }),
      onBlur: () => this.setState({ focused: false }),
      onPrimary: () => { if (this.state.busy) { this.stop(); } else { this.send(); } },
    };
  }
}
</script>
</body>
</html>
