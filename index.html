<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <title>Edward Chu</title>
    <script>
      // Applies the theme before first paint so dark-mode visitors never see a light flash.
      // Mirrors the resolution order in App.jsx: an explicit toggle wins, otherwise the OS setting.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('edward-os-theme') || 'null');
          var explicit = stored && (stored.darkModeExplicit || stored.darkMode === true);
          var dark = explicit
            ? !!stored.darkMode
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable (private mode): fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
